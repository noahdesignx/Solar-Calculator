<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solar Charging Calculator</title>
<style>
:root{--bg:#fff;--text:#0b2a5b;--muted:#5f7aa6;--dark:#e6effc;--mid:#c3d8f8;--orange:#1e6fff;--green:#1e6fff;--red:#c0392b;box-sizing:border-box;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;user-select:none}
body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:400px;margin:0 auto;padding:16px 14px 24px}
.top{text-align:right;margin-bottom:6px}
.label{color:var(--muted);font-size:.9rem}
.big{font-size:5rem;font-weight:300;line-height:1.05;letter-spacing:-1px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.field{background:#eef4fe;border:2px solid transparent;border-radius:16px;padding:10px 14px;text-align:left;color:var(--text);font:inherit;cursor:pointer}
.field.on{border-color:var(--orange)}
.field small{display:block;color:var(--muted);font-size:.78rem}
.field b{font-size:1.7rem;font-weight:400}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:#eef4fe;border-radius:14px;padding:8px 12px}
.stat small{display:block;color:var(--muted);font-size:.75rem}
.stat b{font-size:1.15rem;font-weight:500}
.pill{border-radius:14px;padding:10px 14px;font-weight:600;font-size:.95rem;margin-bottom:6px}
.pill.ok{background:rgba(30,111,255,.12);color:var(--green)}
.pill.bad{background:rgba(192,57,43,.12);color:var(--red)}
.eq{color:var(--muted);font-size:.72rem;font-family:ui-monospace,Menlo,monospace;margin:8px 0 14px;overflow-x:auto;white-space:nowrap}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.k{aspect-ratio:1;border:0;border-radius:999px;font:inherit;font-size:1.9rem;color:var(--text);background:var(--dark);cursor:pointer;transition:filter .1s}
.k:active{filter:brightness(.9)}
.k.fn{background:var(--mid);color:var(--text);font-size:1.5rem}
.k.op{background:var(--orange);color:#fff}
.k.zero{grid-column:span 2;aspect-ratio:auto;text-align:left;padding-left:8%}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="label">Phone charges per day</div>
    <div class="big" id="c">0</div>
  </div>
  <div class="fields">
    <button class="field on" id="fn"><small>Solar panels</small><b id="nv">3</b></button>
    <button class="field" id="ft"><small>Peak-sun hours</small><b id="tv">4</b></button>
  </div>
  <div class="stats">
    <div class="stat"><small>Usable energy</small><b id="e"></b></div>
    <div class="stat"><small>Total cost</small><b id="cost"></b></div>
  </div>
  <div class="pill" id="p1"></div>
  <div class="pill" id="p2"></div>
  <div class="pad" id="pad"></div>
</main>
<script>
var P=100,PRICE=90,FIXED=120,EFF=0.7,PHONE=20,BUDGET=400,TARGET=40;
var S={n:'3',t:'4',active:'n',fresh:true};
function $(i){return document.getElementById(i);}
var keys=[['7'],['8'],['9'],['AC','fn'],['4'],['5'],['6'],['⌫','fn'],['1'],['2'],['3'],['.'],['0','zero'],['−','op'],['+','op']];
var pad=$('pad');
keys.forEach(function(k){var b=document.createElement('button');b.className='k '+(k[1]||'');b.textContent=k[0];b.setAttribute('aria-label',k[0]);b.onclick=function(){press(k[0]);};pad.appendChild(b);});
var max={n:99,t:24};
function val(f){var v=parseFloat(S[f]);return isNaN(v)?0:v;}
function press(k){
  var f=S.active;
  if(k==='AC'){S.n='3';S.t='4';S.fresh=true;}
  else if(k==='⌫'){S[f]=S[f].length>1?S[f].slice(0,-1):'0';S.fresh=false;}
  else if(k==='+'||k==='−'){var step=f==='t'?0.5:1,v=Math.round((val(f)+(k==='+'?step:-step))*100)/100;S[f]=String(Math.min(max[f],Math.max(0,v)));S.fresh=true;}
  else if(k==='.'){if(f==='t'){if(S.fresh){S[f]='0.';S.fresh=false;}else if(S[f].indexOf('.')<0){S[f]+='.';}}}
  else{var nx=S.fresh||S[f]==='0'?k:S[f]+k;if(parseFloat(nx)<=max[f]&&nx.length<=5){S[f]=nx;}S.fresh=false;}
  render();
}
function pick(f){S.active=f;S.fresh=true;render();}
$('fn').onclick=function(){pick('n');};$('ft').onclick=function(){pick('t');};
function render(){
  var N=val('n'),h=val('t');
  var E=N*P*h*EFF,exact=E/PHONE,ch=Math.floor(exact+1e-9),C=N*PRICE+FIXED;
  $('nv').textContent=S.n;$('tv').textContent=S.t;
  $('fn').className='field'+(S.active==='n'?' on':'');$('ft').className='field'+(S.active==='t'?' on':'');
  $('c').textContent=ch;
  $('e').textContent=Math.round(E*100)/100+' Wh';
  $('cost').textContent='$'+C;
  var okT=ch>=TARGET,okB=C<=BUDGET;
  var p1=$('p1'),p2=$('p2');
  p1.className='pill '+(okT?'ok':'bad');p1.textContent=(okT?'✓ Target met: ':'✗ Target missed: ')+ch+' of '+TARGET+' charges';
  p2.className='pill '+(okB?'ok':'bad');p2.textContent=(okB?'✓ Within budget: $':'✗ Over budget: $')+C+' of $'+BUDGET;
}
render();
</script>
</body>
</html>
